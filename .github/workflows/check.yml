name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install the locked dependency graph
        run: bun install --frozen-lockfile
      - name: Run source and publication checks
        run: bun run check
      - name: Build the editable frontend
        run: bun run frontend:build
      - name: Verify a fresh clean-history export is lossless
        run: bun run publication:check
