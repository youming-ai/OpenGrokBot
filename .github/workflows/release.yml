name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install the locked dependency graph
        run: bun install --frozen-lockfile
      - name: Bootstrap the pinned upstream runtime
        run: bun run bootstrap
      - name: Package the app and DMG
        run: bun run package && bun run package:dmg
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
      - name: Publish the continuous main build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous (main)
          prerelease: true
          files: dist/*.dmg
          generate_release_notes: false
          body: |
            Bleeding-edge build from `main` (${{ github.sha }}).
            Same ad-hoc signature caveats as local builds; see README.
            The in-app updater only tracks stable releases, so this never
            prompts existing installs.
