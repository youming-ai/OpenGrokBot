name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install the locked dependency graph
        run: bun install --frozen-lockfile
      - name: Bootstrap the pinned upstream runtime
        run: bun run bootstrap
      - name: Package the app and DMG
        run: bun run package && bun run package:dmg
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
